<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catálogo PeNaModa: moda com tamanhos e preços atualizados.">
  <meta name="theme-color" content="#ffffff">
  <title>PeNaModa – Catálogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <!-- Use a versão 2 atual do SDK, compatível com chaves sb_publishable_. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{color-scheme:light;--ink:#1b1b1d;--muted:#6b6b70;--line:#e6e4e2;--soft:#f3f2f1;--red:#d0021b;--red-hover:#a80016;--bg:#fff;--radius:8px}
    *{box-sizing:border-box}body{margin:0;font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);line-height:1.45;-webkit-font-smoothing:antialiased}
    .header{position:relative;padding:2.5rem 1rem 1.5rem;text-align:center;border-bottom:1px solid var(--line)}.header h1{margin:0;font-size:clamp(2.25rem,8vw,3.5rem);font-weight:800;letter-spacing:-.03em;line-height:1}.header h1 span{color:var(--red)}.header p{margin:.6rem 0 0;color:var(--muted)}
    .cart-open{position:absolute;top:1rem;right:max(1rem,calc((100vw - 1200px)/2));padding:.65rem .9rem;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}.cart-count{display:inline-grid;min-width:1.45rem;height:1.45rem;margin-left:.3rem;padding:0 .25rem;place-items:center;border-radius:999px;color:#fff;background:var(--red);font-size:.8rem}
    main{max-width:1200px;margin:0 auto;padding:1.5rem 1rem 4rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:1.5rem 1rem}@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2rem 1.25rem}}
    .card{display:flex;min-width:0;flex-direction:column}.photo{aspect-ratio:4/5;overflow:hidden;border-radius:var(--radius);background:var(--soft)}.photo img{display:block;width:100%;height:100%;object-fit:cover}.card h2{margin:.75rem 0 0;font-size:1rem;font-weight:600;overflow-wrap:anywhere}.price{margin-top:.2rem;color:var(--red);font-size:1.2rem;font-weight:800}
    .sizes{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.75rem}.size-btn{min-width:2.75rem;min-height:2.75rem;padding:0 .6rem;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:var(--bg);font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}.size-btn:hover{border-color:var(--ink)}.size-btn[aria-pressed=true]{border-color:var(--ink);color:#fff;background:var(--ink)}
    .add-cart,.checkout{display:block;width:100%;margin-top:.9rem;padding:.75rem 1rem;border:0;border-radius:6px;color:#fff;background:var(--red);font:inherit;font-size:.95rem;font-weight:600;text-align:center;cursor:pointer}.add-cart:hover,.checkout:hover{background:var(--red-hover)}.add-cart:disabled,.checkout:disabled{background:#aaa;cursor:not-allowed}.card-notice{min-height:1.3em;margin:.35rem 0 0;color:var(--muted);font-size:.85rem}
    :focus-visible{outline:3px solid var(--ink);outline-offset:3px}.skeleton .photo,.skeleton .line{background:linear-gradient(90deg,var(--soft) 25%,#fff 50%,var(--soft) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite linear}.skeleton .line{width:70%;height:1rem;margin-top:.75rem;border-radius:4px}.skeleton .line.short{width:35%}@keyframes shimmer{to{background-position:-200% 0}}
    .state{grid-column:1/-1;padding:3rem 1rem;color:var(--muted);text-align:center}.state strong{display:block;margin-bottom:.4rem;color:var(--ink);font-size:1.15rem}.state button{margin-top:1rem;padding:.75rem 1.4rem;border:0;border-radius:6px;color:#fff;background:var(--ink);font:inherit;font-weight:600;cursor:pointer}
    dialog{width:min(94vw,560px);max-height:85vh;padding:0;border:1px solid var(--line);border-radius:12px;color:var(--ink);box-shadow:0 20px 70px #0003}dialog::backdrop{background:#0007}.cart-panel{padding:1.25rem}.cart-heading{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-bottom:1rem;border-bottom:1px solid var(--line)}.cart-heading h2{margin:0;font-size:1.35rem}.icon-button{min-width:2.5rem;min-height:2.5rem;border:1px solid var(--line);border-radius:50%;background:#fff;font:inherit;font-size:1.25rem;cursor:pointer}.cart-items{display:grid;max-height:48vh;overflow-y:auto}.cart-empty{padding:2rem 0;color:var(--muted);text-align:center}.cart-item{display:grid;grid-template-columns:1fr auto;gap:.75rem;padding:1rem 0;border-bottom:1px solid var(--line)}.cart-item h3{margin:0 0 .2rem;font-size:1rem}.cart-item p{margin:.15rem 0;color:var(--muted);font-size:.9rem}.cart-item-price{color:var(--ink)!important;font-weight:700}.cart-controls{display:flex;align-items:center;gap:.4rem}.quantity-button,.remove-button{min-width:2rem;min-height:2rem;border:1px solid var(--line);border-radius:5px;background:#fff;font:inherit;cursor:pointer}.remove-button{color:var(--red)}.cart-summary{padding-top:1rem}.cart-total{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:800}.cart-help{margin:.6rem 0 0;color:var(--muted);font-size:.9rem}
    @media(max-width:480px){.header{padding-top:4rem}.cart-open{top:.75rem;right:.75rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important}.skeleton .photo,.skeleton .line{animation:none}}
  </style>
</head>
<body>
  <header class="header">
    <button class="cart-open" id="abrir-carrinho" type="button" aria-haspopup="dialog" aria-controls="carrinho">🛒 Carrinho <span class="cart-count" id="quantidade-carrinho" aria-label="0 itens">0</span></button>
    <h1>Pe<span>Na</span>Moda</h1>
    <p>Escolha o tamanho, adicione ao carrinho e finalize seu pedido</p>
  </header>
  <main><div class="grid" id="catalogo" aria-live="polite" aria-busy="true" aria-label="Produtos do catálogo"></div></main>
  <dialog id="carrinho" aria-labelledby="titulo-carrinho"><section class="cart-panel">
    <div class="cart-heading"><h2 id="titulo-carrinho">Seu carrinho</h2><button class="icon-button" id="fechar-carrinho" type="button" aria-label="Fechar carrinho">×</button></div>
    <div class="cart-items" id="itens-carrinho" aria-live="polite"></div>
    <div class="cart-summary"><div class="cart-total"><span>Total</span><span id="total-carrinho">R$ 0,00</span></div><p class="cart-help" id="aviso-checkout"></p><button class="checkout" id="finalizar-pedido" type="button">Finalizar pedido pelo WhatsApp</button></div>
  </section></dialog>
  <script>
    'use strict';
    const SUPABASE_URL='https://lzperhbkeanfrflcdtkd.supabase.co';
    const SUPABASE_KEY='sb_publishable_juaoZjOGkOV2zDuGKxkYpg_qG0pIEBk';
    const GITHUB_IMAGES_URL='https://penamodams.github.io/catalogo-penamoda/';
    const WHATSAPP=''; // Configure DDI + DDD + número, somente dígitos. Ex.: '5567999999999'.
    const REQUEST_TIMEOUT_MS=15000, CART_STORAGE_KEY='penamoda-carrinho-v1';
    const container=document.getElementById('catalogo'), dialog=document.getElementById('carrinho'), cartItemsElement=document.getElementById('itens-carrinho');
    const totalElement=document.getElementById('total-carrinho'), cartCountElement=document.getElementById('quantidade-carrinho'), telefoneWhatsApp=String(WHATSAPP).replace(/\D/g,'');
    const SEM_FOTO='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500"><rect width="400" height="500" fill="#f3f2f1"/><text x="200" y="250" fill="#6b6b70" font-family="sans-serif" font-size="20" text-anchor="middle">Foto em breve</text></svg>');
    let erroInicializacao='';
    function criarClienteSupabase(){
      if(!window.supabase||typeof window.supabase.createClient!=='function'){erroInicializacao='A biblioteca Supabase não carregou. Verifique a conexão e recarregue a página.';console.error(erroInicializacao);return null}
      try{return window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(error){erroInicializacao='Não foi possível inicializar o Supabase. Confira a URL e a chave publishable configuradas.';console.error(erroInicializacao,error);return null}
    }
    const db=criarClienteSupabase();
    function formatarPreco(valor){if(valor===null||valor===undefined||String(valor).trim()==='')return'Consulte';const n=Number(valor);return Number.isFinite(n)?n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'Consulte'}
    function obterTamanhos(valor){const itens=Array.isArray(valor)?valor:String(valor??'').split(',');return[...new Set(itens.map((t)=>String(t).trim()).filter(Boolean))]}
    function urlDaFoto(nome){const partes=String(nome??'').replaceAll('\\','/').split('/').filter(Boolean);if(!partes.length||partes.some((parte)=>parte==='.'||parte==='..'))return SEM_FOTO;return GITHUB_IMAGES_URL+partes.map(encodeURIComponent).join('/')}
    function carregarCarrinhoSalvo(){try{const dados=JSON.parse(localStorage.getItem(CART_STORAGE_KEY)||'[]');return Array.isArray(dados)?dados.filter((i)=>i&&typeof i.name==='string'&&typeof i.size==='string'&&Number.isFinite(i.price)&&i.price>=0&&Number.isInteger(i.quantity)&&i.quantity>0):[]}catch(error){console.warn('Não foi possível restaurar o carrinho.',error);return[]}}
    let carrinho=carregarCarrinhoSalvo();
    function salvarCarrinho(){try{localStorage.setItem(CART_STORAGE_KEY,JSON.stringify(carrinho))}catch(error){console.warn('Não foi possível salvar o carrinho neste navegador.',error)}}
    function mostrarCarregando(){container.setAttribute('aria-busy','true');container.replaceChildren(...Array.from({length:8},()=>{const card=document.createElement('div');card.className='card skeleton';card.setAttribute('aria-hidden','true');const photo=document.createElement('div');photo.className='photo';const line=document.createElement('div');line.className='line';const short=document.createElement('div');short.className='line short';card.append(photo,line,short);return card}))}
    function mostrarMensagem(titulo,texto,botao=false){container.setAttribute('aria-busy','false');const state=document.createElement('div');state.className='state';state.setAttribute('role','status');const strong=document.createElement('strong');strong.textContent=titulo;const message=document.createElement('span');message.textContent=texto;state.append(strong,message);if(botao){const retry=document.createElement('button');retry.type='button';retry.textContent='Tentar de novo';retry.addEventListener('click',carregarProdutos);state.append(document.createElement('br'),retry)}container.replaceChildren(state)}
    function criarCard(produto,index){const nome=String(produto.descricao??'').trim()||'Produto sem nome',n=Number(produto.valor),precoValido=produto.valor!==null&&produto.valor!==undefined&&String(produto.valor).trim()!==''&&Number.isFinite(n)&&n>=0;const card=document.createElement('article');card.className='card';card.dataset.nome=nome;card.dataset.preco=precoValido?String(n):'';const photo=document.createElement('div');photo.className='photo';const img=document.createElement('img');img.src=produto.foto?urlDaFoto(produto.foto):SEM_FOTO;img.alt=nome;img.width=400;img.height=500;img.decoding='async';if(index>=4)img.loading='lazy';img.addEventListener('error',()=>{if(img.src!==SEM_FOTO)img.src=SEM_FOTO});photo.append(img);const title=document.createElement('h2');title.textContent=nome;const price=document.createElement('p');price.className='price';price.textContent=formatarPreco(produto.valor);card.append(photo,title,price);const sizes=obterTamanhos(produto.tamanhos);if(sizes.length){const group=document.createElement('div');group.className='sizes';group.setAttribute('role','group');group.setAttribute('aria-label',`Escolha o tamanho de ${nome}`);sizes.forEach((size)=>{const button=document.createElement('button');button.type='button';button.className='size-btn';button.setAttribute('aria-pressed','false');button.textContent=size;group.append(button)});card.append(group)}const add=document.createElement('button');add.type='button';add.className='add-cart';add.textContent='Adicionar ao carrinho';add.disabled=!precoValido;if(!precoValido)add.title='Produto sem preço válido';const notice=document.createElement('p');notice.className='card-notice';notice.setAttribute('aria-live','polite');card.append(add,notice);return card}
    function renderizarCarrinho(){cartItemsElement.replaceChildren();if(!carrinho.length){const empty=document.createElement('p');empty.className='cart-empty';empty.textContent='Seu carrinho está vazio. Escolha um produto para começar.';cartItemsElement.append(empty)}carrinho.forEach((item,index)=>{const row=document.createElement('article');row.className='cart-item';const details=document.createElement('div'),name=document.createElement('h3'),size=document.createElement('p'),price=document.createElement('p');name.textContent=item.name;size.textContent=`Tamanho: ${item.size}`;price.className='cart-item-price';price.textContent=`${formatarPreco(item.price)} cada`;details.append(name,size,price);const controls=document.createElement('div');controls.className='cart-controls';[['decrease','−',`Diminuir quantidade de ${item.name}`],['increase','+',`Aumentar quantidade de ${item.name}`],['remove','×',`Remover ${item.name} do carrinho`]].forEach(([action,label,aria])=>{const b=document.createElement('button');b.type='button';b.className=action==='remove'?'remove-button':'quantity-button';b.dataset.action=action;b.dataset.index=String(index);b.setAttribute('aria-label',aria);b.textContent=label;controls.append(b);if(action==='decrease'){const q=document.createElement('span');q.textContent=String(item.quantity);controls.append(q)}});row.append(details,controls);cartItemsElement.append(row)});const count=carrinho.reduce((sum,item)=>sum+item.quantity,0),total=carrinho.reduce((sum,item)=>sum+item.price*item.quantity,0);cartCountElement.textContent=String(count);cartCountElement.setAttribute('aria-label',`${count} ${count===1?'item':'itens'}`);totalElement.textContent=formatarPreco(total);document.getElementById('finalizar-pedido').disabled=!carrinho.length||!telefoneWhatsApp;document.getElementById('aviso-checkout').textContent=telefoneWhatsApp?'':'Configure o número no campo WHATSAPP para habilitar o pedido.';salvarCarrinho()}
    function adicionarAoCarrinho(card){const selected=card.querySelector('.size-btn[aria-pressed="true"]'),hasSizes=Boolean(card.querySelector('.sizes')),notice=card.querySelector('.card-notice');if(hasSizes&&!selected){notice.textContent='Escolha um tamanho antes de adicionar.';card.querySelector('.size-btn')?.focus();return}const price=Number(card.dataset.preco);if(!Number.isFinite(price)||price<0){notice.textContent='Preço indisponível para este produto.';return}const size=selected?selected.textContent:'Único',existing=carrinho.find((item)=>item.name===card.dataset.nome&&item.size===size&&item.price===price);if(existing)existing.quantity++;else carrinho.push({name:card.dataset.nome,size,price,quantity:1});notice.textContent='Adicionado ao carrinho!';renderizarCarrinho()}
    container.addEventListener('click',(event)=>{if(!(event.target instanceof Element))return;const size=event.target.closest('.size-btn');if(size&&container.contains(size)){const card=size.closest('.card');if(!card)return;const wasSelected=size.getAttribute('aria-pressed')==='true';card.querySelectorAll('.size-btn').forEach((button)=>button.setAttribute('aria-pressed','false'));size.setAttribute('aria-pressed',String(!wasSelected));card.querySelector('.card-notice').textContent='';return}const add=event.target.closest('.add-cart');if(add&&container.contains(add)){const card=add.closest('.card');if(card)adicionarAoCarrinho(card)}});
    cartItemsElement.addEventListener('click',(event)=>{if(!(event.target instanceof Element))return;const button=event.target.closest('[data-action]');if(!button)return;const index=Number(button.dataset.index),item=carrinho[index];if(!item)return;if(button.dataset.action==='increase')item.quantity++;if(button.dataset.action==='decrease')item.quantity--;if(button.dataset.action==='remove'||item.quantity<=0)carrinho.splice(index,1);renderizarCarrinho()});
    document.getElementById('abrir-carrinho').addEventListener('click',()=>dialog.showModal());document.getElementById('fechar-carrinho').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',(event)=>{if(event.target===dialog)dialog.close()});
    document.getElementById('finalizar-pedido').addEventListener('click',()=>{if(!telefoneWhatsApp||!carrinho.length)return;const lines=carrinho.map((item)=>`• ${item.name} — tam. ${item.size} — ${item.quantity}x ${formatarPreco(item.price)} = ${formatarPreco(item.price*item.quantity)}`),total=carrinho.reduce((sum,item)=>sum+item.price*item.quantity,0),message=`Olá! Gostaria de fazer este pedido:\n${lines.join('\n')}\n\nTotal: ${formatarPreco(total)}`;window.open(`https://wa.me/${telefoneWhatsApp}?text=${encodeURIComponent(message)}`,'_blank','noopener,noreferrer')});
    let requisicaoAtual=0;
    async function carregarProdutos(){const request=++requisicaoAtual;mostrarCarregando();if(!db){mostrarMensagem('Catálogo temporariamente indisponível',erroInicializacao||'Não foi possível conectar ao Supabase. Recarregue a página e tente novamente.',true);return}const controller=new AbortController(),timeout=window.setTimeout(()=>controller.abort(),REQUEST_TIMEOUT_MS);try{const{data,error}=await db.from('produtos').select('descricao, valor, tamanhos, foto').abortSignal(controller.signal);if(error)throw error;if(request!==requisicaoAtual)return;if(!Array.isArray(data)||!data.length){mostrarMensagem('Nenhum produto por aqui ainda','Volte em breve, estamos preparando as novidades.');return}const fragment=document.createDocumentFragment();data.forEach((product,index)=>fragment.append(criarCard(product??{},index)));container.replaceChildren(fragment);container.setAttribute('aria-busy','false')}catch(error){if(request!==requisicaoAtual)return;console.error('Erro ao carregar produtos do Supabase:',error);let message='Verifique a conexão e tente novamente.';if(error?.name==='AbortError')message='A conexão demorou demais. Verifique sua internet e tente novamente.';else if(error?.code==='42P01'||error?.code==='PGRST205')message='A tabela produtos não foi encontrada. Confira o nome da tabela e a configuração da API no Supabase.';else if(error?.code==='42501'||error?.code==='PGRST301'||error?.status===401||error?.status===403)message='O Supabase recusou a leitura. Confira a chave publishable e permita leitura pública na política RLS da tabela produtos.';else if(error?.message)message=`Falha ao consultar o catálogo: ${error.message}`;mostrarMensagem('Não foi possível carregar o catálogo',message,true)}finally{window.clearTimeout(timeout)}}
    renderizarCarrinho();carregarProdutos();
  </script>
</body>
</html>

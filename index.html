<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catálogo PeNaModa: moda com tamanhos e preços atualizados.">
  <meta name="theme-color" content="#ffffff">
  <title>PeNaModa – Catálogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #1b1b1d;
      --muted: #6b6b70;
      --line: #e6e4e2;
      --soft: #f3f2f1;
      --red: #d0021b;
      --red-hover: #a80016;
      --bg: #fff;
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      padding: 2.5rem 1rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }
    .header h1 {
      margin: 0;
      font-size: clamp(2.25rem, 8vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1;
    }
    .header h1 span { color: var(--red); }
    .header p { margin: .6rem 0 0; color: var(--muted); }

    main { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr));
      gap: 1.5rem 1rem;
    }
    @media (min-width: 700px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 2rem 1.25rem; }
    }

    .card { display: flex; min-width: 0; flex-direction: column; }
    .photo { aspect-ratio: 4 / 5; overflow: hidden; border-radius: var(--radius); background: var(--soft); }
    .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .card h2 { margin: .75rem 0 0; font-size: 1rem; font-weight: 600; overflow-wrap: anywhere; }
    .price { margin-top: .2rem; color: var(--red); font-size: 1.2rem; font-weight: 800; }

    .sizes { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .75rem; }
    .size-btn {
      min-width: 2.75rem;
      min-height: 2.75rem;
      padding: 0 .6rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: var(--bg);
      font: inherit;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .size-btn:hover { border-color: var(--ink); }
    .size-btn[aria-pressed="true"] { border-color: var(--ink); color: #fff; background: var(--ink); }

    .buy {
      display: block;
      margin-top: .9rem;
      padding: .75rem 1rem;
      border-radius: 6px;
      color: #fff;
      background: var(--red);
      font-size: .95rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }
    .buy:hover { background: var(--red-hover); }

    :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

    .skeleton .photo, .skeleton .line {
      background: linear-gradient(90deg, var(--soft) 25%, #fff 50%, var(--soft) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite linear;
    }
    .skeleton .line { width: 70%; height: 1rem; margin-top: .75rem; border-radius: 4px; }
    .skeleton .line.short { width: 35%; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .state { grid-column: 1 / -1; padding: 3rem 1rem; color: var(--muted); text-align: center; }
    .state strong { display: block; margin-bottom: .4rem; color: var(--ink); font-size: 1.15rem; }
    .state button {
      margin-top: 1rem;
      padding: .75rem 1.4rem;
      border: 0;
      border-radius: 6px;
      color: #fff;
      background: var(--ink);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .state button:hover { background: #3b3b3e; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
      .skeleton .photo, .skeleton .line { animation: none; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>Pe<span>Na</span>Moda</h1>
    <p>Escolha o tamanho e peça pelo WhatsApp</p>
  </header>

  <main>
    <div class="grid" id="catalogo" aria-live="polite" aria-busy="true" aria-label="Produtos do catálogo"></div>
  </main>

  <script>
    'use strict';

    // A chave publishable/anon é pública por definição. Restrinja o acesso aos dados
    // usando as políticas RLS do Supabase; nunca coloque uma service_role key aqui.
    const SUPABASE_URL = 'https://lzperhbkeanfrflcdtkd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_juaoZjOGkOV2zDuGKxkYpg_qG0pIEBk';
    const GITHUB_IMAGES_URL = 'https://penamodams.github.io/catalogo-penamoda/';
    const WHATSAPP = ''; // DDI + DDD + número, somente dígitos. Ex.: '5567999999999'. Vazio = oculta o botão.
    const REQUEST_TIMEOUT_MS = 15000;

    const container = document.getElementById('catalogo');
    const SEM_FOTO = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500"><rect width="400" height="500" fill="#f3f2f1"/><text x="200" y="250" fill="#6b6b70" font-family="sans-serif" font-size="20" text-anchor="middle">Foto em breve</text></svg>'
    );
    const telefoneWhatsApp = String(WHATSAPP).replace(/\D/g, '');

    function criarClienteSupabase() {
      if (!window.supabase || typeof window.supabase.createClient !== 'function') return null;
      try {
        return window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      } catch (error) {
        console.error('Não foi possível inicializar o Supabase:', error);
        return null;
      }
    }

    const db = criarClienteSupabase();

    function formatarPreco(valor) {
      if (valor === null || valor === undefined || String(valor).trim() === '') return 'Consulte';
      const numero = Number(valor);
      return Number.isFinite(numero)
        ? numero.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
        : 'Consulte';
    }

    function obterTamanhos(valor) {
      const itens = Array.isArray(valor) ? valor : String(valor ?? '').split(',');
      return [...new Set(itens.map((tamanho) => String(tamanho).trim()).filter(Boolean))];
    }

    // Os nomes de imagem devem ser caminhos relativos dentro do repositório de imagens.
    // Codifica cada segmento e impede que caminhos ../ saiam da pasta publicada.
    function urlDaFoto(nome) {
      const segmentos = String(nome ?? '').replaceAll('\\', '/').split('/').filter(Boolean);
      if (!segmentos.length || segmentos.some((parte) => parte === '.' || parte === '..')) return SEM_FOTO;
      return GITHUB_IMAGES_URL + segmentos.map(encodeURIComponent).join('/');
    }

    function mostrarCarregando() {
      container.setAttribute('aria-busy', 'true');
      container.replaceChildren(...Array.from({ length: 8 }, () => {
        const card = document.createElement('div');
        card.className = 'card skeleton';
        card.setAttribute('aria-hidden', 'true');
        const foto = document.createElement('div');
        foto.className = 'photo';
        const linha = document.createElement('div');
        linha.className = 'line';
        const linhaCurta = document.createElement('div');
        linhaCurta.className = 'line short';
        card.append(foto, linha, linhaCurta);
        return card;
      }));
    }

    function mostrarMensagem(titulo, texto, comBotao = false) {
      container.setAttribute('aria-busy', 'false');
      const estado = document.createElement('div');
      estado.className = 'state';
      estado.setAttribute('role', 'status');
      const tituloElemento = document.createElement('strong');
      tituloElemento.textContent = titulo;
      const textoElemento = document.createElement('span');
      textoElemento.textContent = texto;
      estado.append(tituloElemento, textoElemento);

      if (comBotao) {
        const botao = document.createElement('button');
        botao.type = 'button';
        botao.textContent = 'Tentar de novo';
        botao.addEventListener('click', carregarProdutos);
        estado.append(document.createElement('br'), botao);
      }
      container.replaceChildren(estado);
    }

    function criarCard(produto, indice) {
      const descricao = String(produto.descricao ?? '').trim() || 'Produto sem nome';
      const preco = formatarPreco(produto.valor);
      const card = document.createElement('article');
      card.className = 'card';
      card.dataset.nome = descricao;
      card.dataset.preco = preco;

      const molduraFoto = document.createElement('div');
      molduraFoto.className = 'photo';
      const imagem = document.createElement('img');
      imagem.src = produto.foto ? urlDaFoto(produto.foto) : SEM_FOTO;
      imagem.alt = descricao;
      imagem.width = 400;
      imagem.height = 500;
      imagem.decoding = 'async';
      if (indice >= 4) imagem.loading = 'lazy';
      imagem.addEventListener('error', () => {
        if (imagem.src !== SEM_FOTO) imagem.src = SEM_FOTO;
      });
      molduraFoto.append(imagem);

      const titulo = document.createElement('h2');
      titulo.textContent = descricao;
      const precoElemento = document.createElement('p');
      precoElemento.className = 'price';
      precoElemento.textContent = preco;
      card.append(molduraFoto, titulo, precoElemento);

      const tamanhos = obterTamanhos(produto.tamanhos);
      if (tamanhos.length) {
        const grupo = document.createElement('div');
        grupo.className = 'sizes';
        grupo.setAttribute('role', 'group');
        grupo.setAttribute('aria-label', `Tamanhos de ${descricao}`);
        tamanhos.forEach((tamanho) => {
          const botao = document.createElement('button');
          botao.type = 'button';
          botao.className = 'size-btn';
          botao.setAttribute('aria-pressed', 'false');
          botao.textContent = tamanho;
          grupo.append(botao);
        });
        card.append(grupo);
      }

      if (telefoneWhatsApp) {
        const link = document.createElement('a');
        link.className = 'buy';
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = 'Pedir no WhatsApp';
        atualizarLink(card, link);
        card.append(link);
      }
      return card;
    }

    function atualizarLink(card, link = card.querySelector('.buy')) {
      if (!link) return;
      const selecionado = card.querySelector('.size-btn[aria-pressed="true"]');
      const mensagem = `Olá! Quero o produto "${card.dataset.nome}" (${card.dataset.preco})` +
        (selecionado ? `, tamanho ${selecionado.textContent}.` : '.');
      link.href = `https://wa.me/${telefoneWhatsApp}?text=${encodeURIComponent(mensagem)}`;
    }

    container.addEventListener('click', (evento) => {
      if (!(evento.target instanceof Element)) return;
      const botao = evento.target.closest('.size-btn');
      if (!botao || !container.contains(botao)) return;
      const card = botao.closest('.card');
      if (!card) return;
      const estavaSelecionado = botao.getAttribute('aria-pressed') === 'true';
      card.querySelectorAll('.size-btn').forEach((item) => item.setAttribute('aria-pressed', 'false'));
      botao.setAttribute('aria-pressed', String(!estavaSelecionado));
      atualizarLink(card);
    });

    let requisicaoAtual = 0;
    async function carregarProdutos() {
      const idRequisicao = ++requisicaoAtual;
      mostrarCarregando();

      if (!db) {
        mostrarMensagem('Catálogo temporariamente indisponível', 'Não foi possível conectar ao serviço do catálogo. Tente novamente mais tarde.', true);
        return;
      }

      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
      try {
        const { data, error } = await db
          .from('produtos')
          .select('descricao, valor, tamanhos, foto')
          .abortSignal(controller.signal);
        if (error) throw error;
        if (idRequisicao !== requisicaoAtual) return;

        if (!Array.isArray(data) || data.length === 0) {
          mostrarMensagem('Nenhum produto por aqui ainda', 'Volte em breve, estamos preparando as novidades.');
          return;
        }

        const fragmento = document.createDocumentFragment();
        data.forEach((produto, indice) => fragmento.append(criarCard(produto ?? {}, indice)));
        container.replaceChildren(fragmento);
        container.setAttribute('aria-busy', 'false');
      } catch (erro) {
        if (idRequisicao !== requisicaoAtual) return;
        console.error('Erro ao carregar produtos:', erro);
        const texto = erro?.name === 'AbortError'
          ? 'A conexão demorou demais. Verifique sua internet e tente novamente.'
          : 'Verifique sua conexão e tente novamente.';
        mostrarMensagem('Não foi possível carregar o catálogo', texto, true);
      } finally {
        window.clearTimeout(timeout);
      }
    }

    carregarProdutos();
  </script>
</body>
</html>

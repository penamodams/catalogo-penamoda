<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeNaModa - Catálogo Exclusivo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ... (mantenha o CSS que te enviei antes) ... */
    </style>
</head>
<body>

    <div class="header">
        <h1>Pe<span>Na</span>Moda</h1>
    </div>

    <!-- O erro vai aparecer aqui na tela -->
    <div id="loading" style="text-align: center; color: #D0021B; font-weight: bold; padding: 20px;">
        Carregando catálogo...
    </div>

    <div class="grid" id="catalogo"></div>

    <script>
        const SUPABASE_URL = 'https://izperhbkeanrfflcdtkd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_juaoZjOGkOV2zDuGKxkYpg_qG0pIEBk'; 
        const GITHUB_IMAGES_URL = 'https://penamodams.github.io/catalogo-penamoda/'; 

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function carregarProdutos() {
            try {
                const { data: produtos, error } = await _supabase
                    .from('produtos')
                    .select('*');

                const loadingDiv = document.getElementById('loading');
                const container = document.getElementById('catalogo');

                if (error) {
                    // Mostra o erro real do Supabase na tela
                    loadingDiv.innerHTML = `Erro no Supabase: ${error.message} | Código: ${error.code}`;
                    console.error(error);
                    return;
                }

                if (!produtos || produtos.length === 0) {
                    loadingDiv.innerHTML = "O banco conectou, mas não retornou nenhum produto.";
                    return;
                }

                loadingDiv.style.display = 'none'; 
                container.innerHTML = ''; 

                produtos.forEach(produto => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    let sizesHtml = '';
                    if (produto.tamanhos) {
                        const tamanhosArray = produto.tamanhos.split(',').map(t => t.trim());
                        tamanhosArray.forEach(tam => {
                            sizesHtml += `<button class="size-btn" onclick="selecionarTamanho(this)">${tam}</button>`;
                        });
                    }

                    const precoFormatado = parseFloat(produto.valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

                    card.innerHTML = `
                        <img src="${GITHUB_IMAGES_URL}${produto.foto}" alt="${produto.descricao}" onerror="this.src='https://via.placeholder.com/260x320?text=Foto+em+Breve'">
                        <h3>${produto.descricao}</h3>
                        <div class="price">${precoFormatado}</div>
                        <div class="sizes-label">Tamanhos disponíveis</div>
                        <div class="sizes">${sizesHtml}</div>
                    `;

                    container.appendChild(card);
                });

            } catch (err) {
                document.getElementById('loading').innerHTML = `Erro de Conexão: ${err.message}`;
                console.error(err);
            }
        }

        function selecionarTamanho(botao) {
            const botoes = botao.parentElement.querySelectorAll('.size-btn');
            botoes.forEach(btn => btn.classList.remove('selected'));
            botao.classList.add('selected');
        }

        carregarProdutos();
    </script>
</body>
</html>
